name: Build APK

on:
  push:
    branches: [main]
    paths-ignore:
      - "README.md"
      - "LICENSE"
      - "**.md"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.50.1"
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Read version
        id: version
        run: |
          VERSION_NAME=$(sed -n 's/^version: \([^+]*\).*/\1/p' pubspec.yaml | head -1)
          echo "name=$VERSION_NAME" >> "$GITHUB_OUTPUT"

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Configure release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > android/app/newclass-release.jks
            {
              echo "storeFile=newclass-release.jks"
              echo "storePassword=$KEYSTORE_PASSWORD"
              echo "keyAlias=$KEY_ALIAS"
              echo "keyPassword=$KEY_PASSWORD"
            } > android/app/key.properties
          fi

      - name: Build release APK
        run: |
          flutter build apk --release \
            --build-name="${{ steps.version.outputs.name }}" \
            --build-number="${{ github.run_number }}"

      - name: Prepare release assets
        run: |
          mkdir -p build/release
          cp build/app/outputs/flutter-apk/app-release.apk build/release/newclass.apk
          SHA256=$(sha256sum build/release/newclass.apk | awk '{print $1}')
          SIZE=$(stat -c%s build/release/newclass.apk)
          cat > build/release/version.json <<EOF
          {
            "versionName": "${{ steps.version.outputs.name }}",
            "versionCode": ${{ github.run_number }},
            "apk": "newclass.apk",
            "sha256": "$SHA256",
            "size": $SIZE,
            "publishedAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "notes": "Automated build of commit ${{ github.sha }}"
          }
          EOF

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: newclass-apk
          path: |
            build/release/newclass.apk
            build/release/version.json
          if-no-files-found: error
          retention-days: 30

      - name: Publish rolling release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NOTES="Automated build of newclass ${{ steps.version.outputs.name }} (build ${{ github.run_number }}). Commit: ${{ github.sha }}"

          if ! gh release view latest --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            created=0
            for attempt in 1 2 3 4 5; do
              if gh release create latest \
                build/release/newclass.apk build/release/version.json \
                --repo "$GITHUB_REPOSITORY" \
                --title "newclass latest" \
                --notes "$NOTES" \
                --latest; then
                created=1
                break
              fi
              if gh release view latest --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
                created=1
                break
              fi
              echo "release create failed (attempt $attempt), retrying..."
              sleep $((attempt * 10))
            done
            if [ "$created" -ne 1 ]; then
              echo "could not create release"
              exit 1
            fi
          fi

          uploaded=0
          for attempt in 1 2 3 4 5; do
            if gh release upload latest \
              build/release/newclass.apk build/release/version.json \
              --repo "$GITHUB_REPOSITORY" --clobber; then
              uploaded=1
              break
            fi
            echo "asset upload failed (attempt $attempt), retrying..."
            sleep $((attempt * 10))
          done
          if [ "$uploaded" -ne 1 ]; then
            echo "could not upload release assets"
            exit 1
          fi

          edited=0
          for attempt in 1 2 3 4 5; do
            if gh release edit latest \
              --repo "$GITHUB_REPOSITORY" \
              --title "newclass latest" \
              --notes "$NOTES" \
              --latest; then
              edited=1
              break
            fi
            echo "release metadata update failed (attempt $attempt), retrying..."
            sleep $((attempt * 10))
          done
          if [ "$edited" -ne 1 ]; then
            echo "could not update release metadata"
            exit 1
          fi
